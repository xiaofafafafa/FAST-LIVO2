name: Gaussian mapping and LVI-ASW core
on:
  push:
    branches: [feature/gs-livo-adaptive-map]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    timeout-minutes: 30
    steps:
      - name: Install CPU dependencies in a clean Jammy environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential cmake libceres-dev libeigen3-dev python3-scipy python3-numpy python3-pil
      - uses: actions/checkout@v4
      - name: CPU mapping and standalone Ceres tests
        env:
          PYTHON_BIN: /usr/bin/python3
        run: sh scripts/check_gaussian_window.sh
