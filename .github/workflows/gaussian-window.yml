name: Gaussian mapping and LVI-ASW core
on:
  push:
    branches: [feature/gs-livo-adaptive-map]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU dependencies
        run: sudo apt-get update && sudo apt-get install -y libceres-dev libeigen3-dev python3-scipy python3-numpy python3-pil
      - name: CPU mapping and standalone Ceres tests
        env:
          PYTHON_BIN: /usr/bin/python3
        run: sh scripts/check_gaussian_window.sh
